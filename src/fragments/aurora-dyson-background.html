  function drawElectronTransfer(time,atoms){

  const allowInteraction=target=>target instanceof Element&&!target.closest(excluded)&&!root.querySelector('.ah-window-layer:not([hidden])');
  root.addEventListener('pointermove',event=>{
    if(!fullMotion())return;
    const r=root.getBoundingClientRect();
    pointer.targetX=clamp((event.clientX-r.left)/r.width*2-1,-1,1);pointer.targetY=clamp((event.clientY-r.top)/Math.min(r.height,900)*2-1,-1,1);
    pointer.bgX=(event.clientX-r.left)*root.clientWidth/r.width;pointer.bgY=(event.clientY-r.top)*root.clientHeight/r.height;pointer.inside=true;pointer.fine=event.pointerType!=='touch';

    if(!fullMotion()||!allowInteraction(event.target)||event.button!==0)return;

      try{hero.setPointerCapture(event.pointerId);}catch(_){}
    }
  },{passive:true,signal:abort.signal});
  root.addEventListener('pointerup',event=>{
    if(!fullMotion())return;
    const wasDrag=drag?.moved;
    if(drag&&drag.id===event.pointerId){try{hero.releasePointerCapture(event.pointerId);}catch(_){}drag=null;hero.dataset.dysonDragging='false';}
    if(wasDrag||!allowInteraction(event.target))return;
    const rect=root.getBoundingClientRect();
    ripples.push({x:event.clientX-rect.left,y:event.clientY-rect.top,at:clock});ripples=ripples.slice(-4);energy=1;requestFrame();
  },{passive:true,signal:abort.signal});
  root.addEventListener('pointercancel',()=>{drag=null;hero.dataset.dysonDragging='false';},{passive:true,signal:abort.signal});
  document.addEventListener('visibilitychange',updateState,{signal:abort.signal});
  root.addEventListener('aurora-codex-audio',()=>{if(root.dataset.motion!=='off')requestFrame();},{signal:abort.signal});
  window.addEventListener('resize',resize,{passive:true,signal:abort.signal});
  window.addEventListener('pagehide',cleanup,{once:true,signal:abort.signal});
  reducedMotion.addEventListener('change',updateState,{signal:abort.signal});
  // renderTimer updates this label for starts, pauses, resets and completion.
  const focusObserver=new MutationObserver(()=>{focusRunning=focusButton?.dataset.label==='Pause';requestFrame();});
  if(focusButton)focusObserver.observe(focusButton,{attributes:true,attributeFilter:['data-label']});
  const companionObserver=new MutationObserver(()=>{
    companionEnabled=companionToggle?.getAttribute('aria-pressed')==='true';
    if(!companionEnabled){companion.power=0;companion.ready=false;companion.exchange=null;}
    requestFrame();
  });
  if(companionToggle)companionObserver.observe(companionToggle,{attributes:true,attributeFilter:['aria-pressed']});
  const mutation=new MutationObserver(updateState);mutation.observe(root,{attributes:true,attributeFilter:['data-motion','data-paused','data-workspace','style']});
  const resizeObserver=new ResizeObserver(resize);resizeObserver.observe(root);resizeObserver.observe(hero);
  const intersection=new IntersectionObserver(entries=>{
    for(const entry of entries){if(entry.target===root)rootVisible=entry.isIntersecting;if(entry.target===hero)heroVisible=entry.isIntersecting;if(entry.target===bg)bgVisible=entry.isIntersecting;}
    updateState();
  },{threshold:0});intersection.observe(root);intersection.observe(hero);intersection.observe(bg);
  function cleanup(){disposed=true;audioEnergy=0;if(raf)cancelAnimationFrame(raf);raf=0;abort.abort();mutation.disconnect();focusObserver.disconnect();companionObserver.disconnect();resizeObserver.disconnect();intersection.disconnect();}
  resize();updateColours();updateState();
})();
</script>
